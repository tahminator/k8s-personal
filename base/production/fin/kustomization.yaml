apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - secrets.yaml
  - service.yaml
  - monitor.yaml
  - certificate.yaml
  - ingress.yaml
commonLabels:
  app: fin
  environment: production
images:
  - name: tahminator/fin
    newTag: staging-e8db55d

replacements:
  - source:
      kind: Deployment
      name: fin
      fieldPath: spec.template.spec.containers.[name=fin].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: fin
        fieldPaths:
          - spec.template.spec.containers.[name=fin].env.[name=VERSION].value
          - spec.template.metadata.labels.version
