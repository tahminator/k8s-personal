apiVersion: v1
kind: Service
metadata:
  name: traefik-tailscale-ingress
  namespace: infrastructure
  annotations:
    tailscale.com/proxy-group: traefik-ingress
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-infrastructure
  ports:
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
    - name: rustdesk
      port: 21118
      targetPort: rustdesk
      protocol: TCP
