apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich-web
  namespace: infrastructure
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`img.tahmid.io`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: immich-egress
          port: 2283
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich-websecure
  namespace: infrastructure
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`img.tahmid.io`)
      kind: Rule
      services:
        - name: immich-egress
          port: 2283
  tls:
    secretName: immich-tls
