apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-logical-backup
  namespace: infrastructure
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 30
  failedJobsHistoryLimit: 30
  jobTemplate:
    spec:
      activeDeadlineSeconds: 21600 # fail after 6 hrs
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: tahminator/pg-aws:16
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-creds
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-creds
                      key: password
                - name: ENDPOINT
                  value: https://01da7479fc3f52bc6825dd054239f0aa.r2.cloudflarestorage.com
                - name: BUCKET
                  value: backups-v3
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-creds
                      key: ACCESS_KEY
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-creds
                      key: SECRET_KEY
                - name: AWS_DEFAULT_REGION
                  value: auto
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  WORKDIR=$(mktemp -d)
                  trap 'rm -rf "$WORKDIR"' EXIT
                  DATE=$(date +%Y-%m-%d_%H-%M-%S)
                  echo "--- Starting Backup Session: $DATE ---"

                  DBS=$(psql -At -c "SELECT datname FROM pg_database WHERE datistemplate = false AND datname NOT IN ('postgres', 'dbms_job_procedure', 'cnpg_monitoring');")

                  for DB in $DBS; do
                    echo "Backing up database: $DB"
                    # Separate commands so /bin/sh cannot hide a failed dump or gzip.
                    pg_dump -d "$DB" --clean --if-exists --create -f "$WORKDIR/backup.sql"
                    gzip "$WORKDIR/backup.sql"
                    aws s3 cp "$WORKDIR/backup.sql.gz" "s3://$BUCKET/pg/$DATE/$DB.sql.gz" --endpoint-url "$ENDPOINT"
                    rm "$WORKDIR/backup.sql.gz"
                  done

                  echo "--- Backup Session Completed ---"
