# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: infrastructure
spec:
  instances: 1
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  postgresql:
    shared_preload_libraries:
      - vchord
    # pgvector (required by vchord) ships in the standard image; vchord is mounted as an image volume
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - usr/lib/postgresql/18/lib
        extension_control_path:
          - usr/share/postgresql/18
  storage:
    size: 8Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1.5Gi"
      cpu: "1000m"
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-creds
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: postgres-creds
