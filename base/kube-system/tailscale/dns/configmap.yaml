apiVersion: v1
kind: ConfigMap
metadata:
  # `kubectl rollout restart deployment/coredns -n kube-system`
  # DO NOT CHANGE THIS!!!!!!!!
  # k3s looks for this name and does config merging and mounting automatically
  name: coredns-custom
  namespace: kube-system
data:
  tahmid.io.server: |
    tahmid.io:53 {
        hosts {
            # 100.72.23.242 = infrastructure-traefik-tailscale-ingress (ProxyGroup service)
            100.72.23.242 media.tahmid.io
            100.72.23.242 media2.tahmid.io
            100.72.23.242 sh.tahmid.io
            100.72.23.242 m.tahmid.io
            100.72.23.242 soob.tahmid.io
            100.72.23.242 vault.tahmid.io
            100.72.23.242 o.tahmid.io
            100.72.23.242 pc.tahmid.io
            100.72.23.242 metrics.pc.tahmid.io
            100.72.23.242 img.tahmid.io
            fallthrough
        }
        forward . 1.1.1.1
        errors
    }
